kind: pipeline
name: default

steps:
  - name: docker-tag-build
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: jerheij/unbound-recursive
      no_cache: true
      tags: ${DRONE_TAG}
    when:
      event:
        - tag

  - name: docker-latest-build
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: jerheij/unbound-recursive
      no_cache: true
      tags: latest
    when:
      event:
        - push
      branch:
        - main

  - name: docker-stable-build
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: jerheij/unbound-recursive
      no_cache: true
      tags: stable
    when:
      event:
        - cron
        - push
      branch:
        - stable